<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Illustration of the Ranes Safety admin portal and field app">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b22"/><stop offset="1" stop-color="#0b1015"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cc4f3" stop-opacity=".35"/>
      <stop offset="1" stop-color="#27d67e" stop-opacity=".18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04070a" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="960" height="620" fill="none"/>
  <ellipse cx="470" cy="560" rx="420" ry="42" fill="#0b1015" opacity=".10"/>

  <!-- Desktop / portal window -->
  <g filter="url(#soft)">
    <rect x="70" y="52" width="700" height="440" rx="14" fill="url(#screen)" stroke="#26313c"/>
    <rect x="70" y="52" width="700" height="38" rx="14" fill="#1a222b"/>
    <rect x="70" y="76" width="700" height="14" fill="#1a222b"/>
    <circle cx="94" cy="71" r="5" fill="#3a4753"/><circle cx="112" cy="71" r="5" fill="#3a4753"/><circle cx="130" cy="71" r="5" fill="#3a4753"/>
    <rect x="160" y="63" width="230" height="16" rx="8" fill="#111820"/>
    <text x="176" y="76" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5d6c7a">portal · Terminal 4 Expansion</text>

    <!-- sidebar -->
    <rect x="70" y="90" width="150" height="402" fill="#101820"/>
    <rect x="90" y="112" width="86" height="9" rx="4" fill="#2cc4f3" opacity=".85"/>
    <g fill="#33414e">
      <rect x="90" y="146" width="104" height="8" rx="4"/>
      <rect x="90" y="172" width="82" height="8" rx="4"/>
      <rect x="90" y="198" width="96" height="8" rx="4"/>
      <rect x="90" y="224" width="70" height="8" rx="4"/>
      <rect x="90" y="250" width="90" height="8" rx="4"/>
    </g>
    <rect x="80" y="140" width="3" height="20" rx="1.5" fill="#27d67e"/>

    <!-- stat tiles -->
    <g>
      <rect x="244" y="112" width="150" height="76" rx="10" fill="#16202a" stroke="#26313c"/>
      <text x="262" y="140" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#27d67e">98%</text>
      <rect x="262" y="152" width="88" height="7" rx="3.5" fill="#3a4753"/>
      <rect x="262" y="165" width="60" height="7" rx="3.5" fill="#2b3742"/>

      <rect x="408" y="112" width="150" height="76" rx="10" fill="#16202a" stroke="#26313c"/>
      <text x="426" y="140" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#2cc4f3">12</text>
      <rect x="426" y="152" width="96" height="7" rx="3.5" fill="#3a4753"/>
      <rect x="426" y="165" width="54" height="7" rx="3.5" fill="#2b3742"/>

      <rect x="572" y="112" width="150" height="76" rx="10" fill="#16202a" stroke="#26313c"/>
      <text x="590" y="140" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#e6edf3">1,284</text>
      <rect x="590" y="152" width="80" height="7" rx="3.5" fill="#3a4753"/>
      <rect x="590" y="165" width="62" height="7" rx="3.5" fill="#2b3742"/>
    </g>

    <!-- chart -->
    <rect x="244" y="206" width="478" height="164" rx="10" fill="#16202a" stroke="#26313c"/>
    <g fill="#223040">
      <rect x="272" y="300" width="26" height="46" rx="4"/>
      <rect x="312" y="282" width="26" height="64" rx="4"/>
      <rect x="352" y="290" width="26" height="56" rx="4"/>
      <rect x="392" y="262" width="26" height="84" rx="4"/>
      <rect x="432" y="272" width="26" height="74" rx="4"/>
      <rect x="472" y="244" width="26" height="102" rx="4"/>
      <rect x="512" y="256" width="26" height="90" rx="4"/>
      <rect x="552" y="230" width="26" height="116" rx="4"/>
    </g>
    <g fill="#2cc4f3" opacity=".9">
      <rect x="592" y="238" width="26" height="108" rx="4"/>
      <rect x="632" y="222" width="26" height="124" rx="4"/>
      <rect x="672" y="212" width="26" height="134" rx="4"/>
    </g>
    <rect x="266" y="228" width="110" height="8" rx="4" fill="#3a4753"/>

    <!-- table rows -->
    <g>
      <rect x="244" y="388" width="478" height="84" rx="10" fill="#16202a" stroke="#26313c"/>
      <g fill="#2b3742">
        <rect x="266" y="406" width="180" height="8" rx="4"/>
        <rect x="266" y="430" width="220" height="8" rx="4"/>
        <rect x="266" y="454" width="150" height="8" rx="4"/>
      </g>
      <g>
        <rect x="620" y="402" width="80" height="16" rx="8" fill="#27d67e" opacity=".18"/>
        <rect x="620" y="426" width="80" height="16" rx="8" fill="#2cc4f3" opacity=".18"/>
        <rect x="620" y="450" width="80" height="16" rx="8" fill="#3a4753" opacity=".35"/>
      </g>
    </g>
  </g>

  <!-- Phone / field app -->
  <g filter="url(#soft)">
    <rect x="662" y="182" width="230" height="404" rx="30" fill="#0b1015" stroke="#2b3742" stroke-width="2"/>
    <rect x="674" y="196" width="206" height="376" rx="22" fill="url(#screen)"/>
    <rect x="742" y="204" width="70" height="10" rx="5" fill="#0b1015"/>

    <rect x="674" y="196" width="206" height="70" rx="22" fill="url(#glow)"/>
    <rect x="692" y="226" width="96" height="10" rx="5" fill="#e6edf3" opacity=".9"/>
    <rect x="692" y="244" width="60" height="8" rx="4" fill="#9fb0be" opacity=".6"/>

    <!-- tap-in button -->
    <rect x="692" y="282" width="170" height="42" rx="21" fill="#27d67e"/>
    <text x="777" y="308" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#07231a">TAP IN</text>

    <!-- work cards -->
    <g>
      <rect x="692" y="340" width="170" height="66" rx="12" fill="#16202a" stroke="#26313c"/>
      <rect x="706" y="356" width="108" height="8" rx="4" fill="#c8d5e0" opacity=".8"/>
      <rect x="706" y="372" width="76" height="7" rx="3.5" fill="#5d6c7a"/>
      <rect x="706" y="386" width="52" height="12" rx="6" fill="#2cc4f3" opacity=".2"/>

      <rect x="692" y="418" width="170" height="66" rx="12" fill="#16202a" stroke="#26313c"/>
      <rect x="706" y="434" width="92" height="8" rx="4" fill="#c8d5e0" opacity=".8"/>
      <rect x="706" y="450" width="66" height="7" rx="3.5" fill="#5d6c7a"/>
      <rect x="706" y="464" width="52" height="12" rx="6" fill="#27d67e" opacity=".2"/>
    </g>

    <!-- bottom tabs -->
    <rect x="674" y="512" width="206" height="60" rx="22" fill="#101820"/>
    <g fill="#3a4753">
      <circle cx="712" cy="542" r="7"/><circle cx="756" cy="542" r="7"/><circle cx="844" cy="542" r="7"/>
    </g>
    <circle cx="800" cy="542" r="14" fill="#2cc4f3"/>
    <path d="M800 535v14M793 542h14" stroke="#07202b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
